# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,1
# monitor=,preferred,auto,auto

# js-t480 setup
monitor=desc:Dell Inc. DELL S3225QS HG6SF94,              2560x1440@60, 0x0,       1       # Big external monitor
monitor=desc:ASUSTek COMPUTER INC ASUS VG24V 0x00025807,  1920x1080@60, 0x-1080,   1       # Medium external monitor
monitor=desc:LG Display 0x0521,                           1920x1080@60, -1920x0,   1       # Laptop monitor
